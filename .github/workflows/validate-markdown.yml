name: Validate skill documentation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  markdown-links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate relative links and anchors
        run: python3 scripts/check_markdown_links.py .
      - name: Validate workflow consistency
        run: python3 scripts/check_workflow_consistency.py .
